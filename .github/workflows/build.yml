name: Build Minas firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  platformio-build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - ControllerUnit
          - VehicleUnit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run --project-dir "${{ matrix.project }}"

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-pioenv
          path: ${{ matrix.project }}/.pio/build/**/firmware.*
          if-no-files-found: ignore
