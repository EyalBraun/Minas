; Controller Unit = original ESP32/WROVER: PS5 Bluetooth Classic + SD + ML gate.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
    -I include
    -I .
    -D CORE_DEBUG_LEVEL=3
    -D MINAS_FW_VERSION=\"dt-ps5-sd-ml-gate-v2\"
lib_deps =
    https://github.com/rodneybakiskan/ps5-esp32.git
