; --- Minas Project PlatformIO Configuration ---
; Project: PS5 Controller + ESP32 Wrover + Servo/ESC + Rewind System

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- Serial Monitor Settings ---
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder    ; Converts hex addresses to line numbers in case of a crash
    time                       ; Adds timestamps to serial logs

; --- Build Flags (Optimization & Features) ---
build_flags = 
    -DBOARD_HAS_PSRAM          ; Enables the 4MB external RAM on the Wrover
    -mfix-esp32-psram-cache-issue ; Fixes a known silicon bug with PSRAM
    -DCORE_DEBUG_LEVEL=3       ; 0:None, 1:Error, 2:Warn, 3:Info, 4:Debug, 5:Verbose
    -O2                        ; Code optimization for better performance

; --- Library Dependencies ---
lib_deps = 
    https://github.com/rodneybakiskan/ps5-esp32.git ; PS5 Controller Library
    madhephaestus/ESP32Servo @ ^1.1.1              ; Servo/ESC PWM Library

; --- Upload Settings ---
upload_speed = 921600              ; Faster upload (standard is 115200)
board_build.partitions = huge_app.csv ; Gives more space for the Bluetooth stack and your code
board_build.f_cpu = 240000000L     ; Set CPU to max speed (240MHz)